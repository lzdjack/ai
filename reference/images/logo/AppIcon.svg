<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- AI 修复工作台 · App 图标（macOS 图标栅格：824 主体 + 四周 100 留白给投影） -->
  <defs>
    <linearGradient id="bg" x1="0.18" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#3D86FF"/>
      <stop offset="0.55" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <radialGradient id="hl" cx="0.24" cy="0.02" r="0.78">
      <stop offset="0" stop-color="#9CCBFF" stop-opacity=".95"/>
      <stop offset="0.6" stop-color="#9CCBFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.82" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#FF5FA8" stop-opacity=".38"/>
      <stop offset="1" stop-color="#FF5FA8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="spk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4DCFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#2A1A8C" flood-opacity=".42"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1A1050" flood-opacity=".22"/>
    </filter>
    <filter id="gs" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#160C5C" flood-opacity=".45"/>
    </filter>
    <filter id="sg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- 主体 -->
  <g filter="url(#shadow)"><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/></g>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#hl)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="412" fill="url(#sheen)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#edge)" stroke-width="3"/>

  <!-- 代码括号 + 对勾（24 栅格 ×19，中心对齐） -->
  <g filter="url(#gs)" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(284 296) scale(19)">
    <path d="M8 7.2L3.6 12 8 16.8" stroke="#fff" stroke-width="2.3"/>
    <path d="M16 7.2l4.4 4.8-4.4 4.8" stroke="#fff" stroke-opacity=".58" stroke-width="2.3"/>
    <path d="M9.6 12.3l1.8 1.8 3.2-4" stroke="#fff" stroke-width="2.5"/>
  </g>

  <!-- 星光：AI -->
  <g filter="url(#sg)" transform="translate(706 318)">
    <path d="M0 -92 L19 -19 L92 0 L19 19 L0 92 L-19 19 L-92 0 L-19 -19 Z" fill="url(#spk)"/>
  </g>
  <path transform="translate(800 418)" d="M0 -30 L6 -6 L30 0 L6 6 L0 30 L-6 6 L-30 0 L-6 -6 Z" fill="#fff" opacity=".75"/>
</svg>
